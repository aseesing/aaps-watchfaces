# Where the AAPS source code lies, relative to this folder. To use another checkout on your own
# machine, set aapsDir in local.properties (it wins over this line).
aapsDir=../AndroidAPS

# The same settings as AAPS
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Xss4m
kotlin.daemon.jvm.options=-Xmx4g
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.native.ignoreDisabledTargets=true
